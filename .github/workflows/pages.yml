name: Publicar Tenebria VTT no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar somente os arquivos da PWA
        run: |
          mkdir -p site-dist
          cp index.html manifest.webmanifest sw.js site-dist/
          cp -R src assets site-dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
