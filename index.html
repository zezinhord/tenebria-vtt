<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#191819"/><meta name="description" content="Tenebria VTT: mesa virtual de RPG, mapas, fichas, dados e combate."/><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https: http: ws: wss:; style-src 'self'; script-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"/>
<link rel="manifest" href="manifest.webmanifest"/><link rel="icon" href="assets/icon.svg" type="image/svg+xml"/><link rel="stylesheet" href="src/style.css"/><title>Tenebria VTT · 0.1.3</title></head>
<body><div id="app">
<header class="topbar"><button class="home-mark" data-action="go-home" title="Escolher modalidade" aria-label="Início">⌂</button><button class="mark" id="toggle-menu" data-action="toggle-menu" aria-label="Abrir ferramentas">☰</button><div class="brand"><span class="brandglyph">✦</span><div><strong>TENEBRIA</strong><small>VIRTUAL TABLETOP · 0.1.3</small></div></div><div class="session-title" id="campaign-title">Campanha</div><span class="mode-label" id="mode-label">● Presencial</span><div class="top-actions"><span id="net-status" class="net-status">● Local</span><button data-action="fit" title="Centralizar mapa">⌖</button><button data-action="fullscreen" title="Tela cheia">⛶</button></div></header>
<main class="layout"><aside id="sidebar" class="sidebar"><nav id="tabs" class="tabs"></nav><div id="panel" class="panel"></div><div class="sidebar-bottom"><span>OBSCURE · TENEBRIA 3.0</span><button data-action="close-sidebar" aria-label="Fechar">✕</button></div></aside>
<section class="stage"><canvas id="board" aria-label="Tabuleiro interativo Tenebria"></canvas><div class="board-actions" id="board-actions"><button data-action="zoom-in" title="Ampliar">+</button><button data-action="zoom-out" title="Diminuir">−</button><button data-action="fit" title="Ajustar">◎</button></div><button id="enable-audio" class="enable-audio" data-action="unlock-audio" hidden>♫ Ativar áudio neste aparelho</button><div class="projector-roll" id="projector-roll" hidden></div><div class="projector-turn" id="projector-turn" hidden></div><div class="overlay-message" id="toast" aria-live="polite"></div><button id="mobile-open" data-action="toggle-menu" aria-label="Abrir menu">☰ Ferramentas</button></section></main>
</div><section id="mode-home" class="mode-home" aria-label="Escolha da modalidade">
  <div class="mode-head"><div class="mode-symbol">✧</div><p class="eyebrow">OBSCURE · VIRTUAL TABLETOP</p><h1>TENEBRIA</h1><p>Seu mundo. Uma campanha. Duas maneiras de jogar.</p></div>
  <div class="mode-choices">
    <button class="mode-card" data-action="choose-mode" data-mode="presencial"><span class="mode-icon">▣</span><strong>Mesa Presencial</strong><span>Use o celular como painel do Mestre e projete o tabuleiro em outra tela pela mesma rede local.</span><em>Entrar na mesa presencial →</em></button>
    <button class="mode-card" data-action="choose-mode" data-mode="online"><span class="mode-icon">◎</span><strong>Mesa Online</strong><span>Reúna jogadores remotos, compartilhe convites e sincronize a campanha pela internet.</span><em>Entrar na mesa online →</em></button>
  </div><div class="mode-foot"><span>Uma única biblioteca de campanhas, mapas e fichas</span><button data-action="choose-mode" data-mode="presencial">Gerenciar campanhas</button></div>
